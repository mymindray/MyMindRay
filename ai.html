<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="description" content="Check in with mood and notes on the AI desk." />
  <meta name="theme-color" content="#080808" />
  <meta name="robots" content="index,follow" />
  <title>AI desk — My MindRay</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ai.css" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="quiet.css" />
</head>
<body>
  <header class="top">
    <a class="nav-chip" href="index.html">Home</a>
    <strong>AI desk</strong>
    <a class="nav-chip" id="aiDash" href="dashboard.html">Dashboard</a>
  </header>
  <main class="chat" id="chat">
    <div class="bubble bot"><div class="txt">Tell me how you feel. A mood tap is saved to your graph by itself. Photos stay in this chat.</div></div>
  </main>
  <section class="moods">
    <button type="button" data-mood="calm">Calm</button>
    <button type="button" data-mood="okay">Okay</button>
    <button type="button" data-mood="low">Low</button>
    <button type="button" data-mood="stressed">Stressed</button>
  </section>
  <div class="thumbs" id="thumbs"></div>
  <form class="composer" id="composer">
    <input type="file" id="gallery" accept="image/*" multiple hidden />
    <div class="plus-wrap">
      <button type="button" class="plus" id="plusBtn" aria-label="Add photo" aria-haspopup="true" aria-expanded="false" title="Add">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
      <div class="attach-menu" id="attachMenu" role="menu">
        <button type="button" id="camBtn" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>Camera</span>
        </button>
        <button type="button" id="galBtn" role="menuitem">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>
          <span>Photos</span>
        </button>
      </div>
    </div>
    <input id="prompt" placeholder="Write a message" autocomplete="off" />
    <button class="send" type="submit" aria-label="Send" title="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <div class="cam-sheet" id="camSheet" hidden>
    <video id="camLive" autoplay playsinline></video>
    <div class="cam-bar">
      <button type="button" id="closeCam">Close</button>
      <button type="button" class="shutter" id="shutter">Take photo</button>
    </div>
    <canvas id="camCanvas" hidden></canvas>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="ai.js"></script>
</body>
</html>
