<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="description" content="Chat with another My MindRay member." />
  <meta name="theme-color" content="#080808" />
  <meta name="robots" content="noindex" />
  <title>Chat — My MindRay</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ai.css" />
  <link rel="stylesheet" href="quiet.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <header class="top chat-top">
    <a class="nav-chip" href="messages.html">Back</a>
    <div class="who" id="who">
      <div class="who-text"><span class="who-name" id="whoName">Chat</span></div>
    </div>
    <a class="nav-chip" href="dashboard.html">Dashboard</a>
  </header>
  <main class="chat" id="chat" aria-live="polite">
    <div class="chat-note" id="chatNote">Loading conversation…</div>
  </main>
  <form class="composer" id="composer" autocomplete="off">
    <input id="prompt" placeholder="Write a message" maxlength="1000" autocomplete="off" disabled />
    <span class="count" id="count" aria-hidden="true"></span>
    <button class="send" id="sendBtn" type="submit" aria-label="Send" title="Send" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
