<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="description" content="Log in or create a My MindRay account." />
  <meta name="theme-color" content="#080808" />
  <meta name="robots" content="index,follow" />
  <title>Log in — My MindRay</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="quiet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">
      <span class="wordmark">My MindRay</span>
    </a>
  </header>
  <div class="stage">
    <section class="card">
      <h1 id="formTitle">Log in</h1>
      <p class="lead" id="formLead">Use your email or continue with Google.</p>
      <button type="button" class="google" id="googleBtn">Continue with Google</button>
      <div class="or">or</div>
      <form id="authForm">
        <label>Email<input type="email" id="email" required autocomplete="email" /></label>
        <label>Password<input type="password" id="password" required autocomplete="current-password" /></label>
        <p class="hint">Password: 8+ characters, with at least one letter and one number. Symbols are fine — just no spaces or currency symbols.</p>
        <p class="ok" id="authOk" hidden></p>
        <p class="err" id="authErr"></p>
        <button class="go" type="submit" id="submitBtn">Log in</button>
      </form>
      <p class="switch-line" id="switchLine">Don't have an account? <button type="button" id="switchBtn">Sign up</button></p>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
